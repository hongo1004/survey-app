      var scrollY = window._preserveScroll ? (window.scrollY || document.documentElement.scrollTop || 0) : 0;

    function renderQuestionStep(step) {
      var html = '<div class="section-header">';
      html += '<span class="section-tag">' + esc(step.id.toUpperCase()) + '</span>';
      html += '<div class="section-title">' + esc(step.title) + '</div>';
      if (step.subtitle) html += '<div class="section-desc">' + esc(step.subtitle) + '</div>';
      html += '</div>';
      (step.questions || []).forEach(function(n) {
        var q = QUESTIONS[n];
        if (q) html += renderQuestion(q);
      });
      return html;
    }

    function renderQuestion(q) {
      var html = '<div class="q-card" id="card-' + q.num + '">';
      html += '<div class="q-num">' + esc(q.num) + '</div>';
      html += '<div class="q-title">' + esc(q.title) + '</div>';
      if (q.note) html += '<div class="q-note">' + esc(q.note) + '</div>';
      var desc = getDesc(q);
      if (desc) html += '<div class="q-desc">' + esc(desc) + '</div>';
      switch (q.type) {
        case 'radio': html += renderRadio(q); break;
        case 'likert': html += renderLikert(q); break;
        case 'multiselect': html += renderMultiSelect(q); break;
        case 'fillin': html += renderFillIn(q); break;
        case 'textarea': html += renderTextarea(q); break;
        case 'text': html += renderTextInput(q); break;
      }
      html += '</div>';
      return html;
    }

    function renderRadio(q) {
      var current = state[q.num] || '';
      var html = '<div class="option-list">';
      q.options.forEach(function(opt) {
        var selected = current === opt.v ? ' selected' : '';
        html += '<div class="option-item' + selected + '" onclick="selectRadio(\'' + q.num + '\', \'' + esc(opt.v) + '\')">';
        html += '<div class="option-radio"></div>';
        html += '<span class="option-text">' + esc(opt.l) + '</span>';
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    function renderLikert(q) {
      var current = state[q.num] || 0;
      if (typeof current !== 'number') current = current.score || 0;
      var html = '<div class="likert-legend">';
      html += '<span>1<br>完全不具备</span><span>2<br>基本不具备</span><span>3<br>一般</span><span>4<br>基本胜任</span><span>5<br>完全胜任</span>';
      html += '</div>';
      html += '<div class="likert-scale">';
      LIKERT_LABELS.forEach(function(lk) {
        var sel = current === lk.num ? ' selected' : '';
        html += '<div class="likert-option' + sel + '" onclick="selectLikert(\'' + q.num + '\', ' + lk.num + ')">';
        html += '<span class="likert-num">' + lk.num + '</span></div>';
      });
      html += '</div>';
      return html;
    }

    function renderMultiSelect(q) {
      var current = state[q.num] || [];
      if (typeof current === 'string') current = current.split(',');
      var maxed = current.length >= (q.maxSelect || 99);
      var html = '<div class="multiselect-info">已选 <span class="multiselect-count' + (maxed ? ' maxed' : '') + '">' + current.length + '</span> / ' + (q.maxSelect || '不限') + ' 项' + (maxed ? '（已达上限）' : '') + '</div>';
      html += '<div class="option-list">';
      q.options.forEach(function(opt) {
        var checked = current.indexOf(opt.v) >= 0;
        var disabled = !checked && maxed;
        var cls = 'checkbox-item' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '');
        html += '<div class="' + cls + '" onclick="toggleMulti(\'' + q.num + '\', \'' + esc(opt.v) + '\', ' + (q.maxSelect || 99) + ')">';
        html += '<div class="checkbox-box"></div>';
        html += '<span class="checkbox-text">' + esc(opt.l) + '</span>';
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    function renderFillIn(q) {
      var html = '';
      if (!q.fields) return html;
      q.fields.forEach(function(f) {
        var key = q.num + '_' + f.key;
        html += '<div class="fillin-field">';
        html += '<div class="fillin-label">' + esc(f.label) + '</div>';
        if (f.type === 'radio_list') {
          var current = state[key] || '';
          html += '<div class="option-list">';
          f.options.forEach(function(o) {
            var sel = current === o ? ' selected' : '';
            html += '<div class="option-item' + sel + '" onclick="setStateValue(\'' + key + '\', \'' + esc(o) + '\'); window._preserveScroll = true; renderStep();">';
            html += '<div class="option-radio"></div>';
            html += '<span class="option-text">' + esc(o) + '</span>';
            html += '</div>';
          });
          html += '</div>';
        } else if (f.type === 'radio_inline') {
          var current2 = state[key] || '';
          html += '<div class="fillin-row">';
          f.options.forEach(function(o) {
            var sel2 = current2 === o ? ' background:var(--accent-light);border-color:var(--accent);' : '';
            html += '<label style="cursor:pointer;padding:8px 14px;border:1px solid var(--rule);border-radius:8px;font-size:13px;' + sel2 + '" onclick="setStateValue(\'' + key + '\', \'' + esc(o) + '\'); window._preserveScroll = true; renderStep();">' + esc(o) + '</label>';
          });
          html += '</div>';
        } else if (f.type === 'multiselect_inline') {
          var arr = state[key] || [];
          if (typeof arr === 'string') arr = arr.split(',');
          var opts = f.dynamic ? getCourseOptions() : f.options;
          var maxed2 = arr.length >= (f.maxSelect || 99);
          html += '<div class="multiselect-info">已选 <span class="multiselect-count' + (maxed2 ? ' maxed' : '') + '">' + arr.length + '</span> / ' + (f.maxSelect || '不限') + '</div>';
          html += '<div class="option-list">';
          opts.forEach(function(o) {
            var checked = arr.indexOf(o) >= 0;
            var disabled2 = !checked && maxed2;
            var cls2 = 'checkbox-item' + (checked ? ' checked' : '') + (disabled2 ? ' disabled' : '');
            html += '<div class="' + cls2 + '" onclick="toggleMulti(\'' + key + '\', \'' + esc(o) + '\', ' + (f.maxSelect || 99) + ')">';
            html += '<div class="checkbox-box"></div>';
            html += '<span class="checkbox-text">' + esc(o) + '</span>';
            html += '</div>';
          });
          html += '</div>';
        } else if (f.type === 'composite') {
          html += '<div class="fillin-row" style="align-items:center;line-height:2;">';
          f.template.forEach(function(seg) {
            if (seg.text) html += '<span class="fillin-text-segment">' + esc(seg.text) + '</span>';
            else if (seg.input) {
              var ikey = q.num + '_' + f.key + '_' + seg.input;
              var val = state[ikey] || '';
              html += '<input type="text" class="fillin-inline-input" style="width:' + (seg.width || '60px') + '" value="' + esc(val) + '" placeholder="' + esc(seg.placeholder || '') + '" oninput="setStateValue(\'' + ikey + '\', this.value)">';
            }
          });
          html += '</div>';
        } else if (f.type === 'textarea') {
          var tval = state[key] || '';
          html += '<textarea class="textarea-input" placeholder="' + esc(f.placeholder || '') + '" oninput="setStateValue(\'' + key + '\', this.value)">' + esc(tval) + '</textarea>';
        }
        html += '</div>';
      });
      return html;
    }

    function renderTextarea(q) {
      var current = state[q.num] || '';
      return '<textarea class="textarea-input" placeholder="' + esc(q.placeholder || '') + '" oninput="setStateValue(\'' + q.num + '\', this.value)">' + esc(current) + '</textarea>';
    }

    function renderTextInput(q) {
      var current = state[q.num] || '';
      return '<input type="text" class="text-input" placeholder="' + esc(q.placeholder || '') + '" value="' + esc(current) + '" oninput="setStateValue(\'' + q.num + '\', this.value)">';
    }

    // ===== 结果页 =====
    function getRoleQs() {
      if (isJianliyuan()) return { basic: ['Q5','Q6','Q7'], advanced: ['Q8','Q9','Q10'], senior: ['Q11','Q12','Q13'] };
      if (isZhuangjian()) return { basic: ['Q14','Q15','Q16'], advanced: ['Q17','Q18','Q19'], senior: ['Q20','Q21','Q22'] };
      return { basic: ['Q23','Q24','Q25'], advanced: ['Q26','Q27','Q28'], senior: ['Q29','Q30','Q31'] };
    }
    function likertScore(v) {
      if (typeof v === 'number') return v;
      if (v && typeof v === 'object' && typeof v.score === 'number') return v.score;
      return 0;
    }
    function avgOf(qs) {
      var scores = qs.map(function(n) { return likertScore(state[n]); }).filter(function(s) { return s > 0; });
      if (!scores.length) return 0;
      return Math.round((scores.reduce(function(a,b){return a+b;},0) / scores.length) * 10) / 10;
    }
    function getBottleneck(basicAvg, advAvg, senAvg) {
      if (basicAvg < 4) return { level: '基本能力', text: '基本能力均分' + basicAvg.toFixed(1) + '分（<4分），未达标，无法支撑进阶', action: '优先夯实基本能力' };
      if (basicAvg >= 4 && advAvg < 4) return { level: '进阶能力', text: '基本能力达标（' + basicAvg.toFixed(1) + '分），进阶能力均分' + advAvg.toFixed(1) + '分（<4分）遇瓶颈', action: '重点突破进阶能力障碍' };
      if (advAvg >= 4 && senAvg < 3) return { level: '高级能力', text: '进阶能力达标（' + advAvg.toFixed(1) + '分），高级能力均分' + senAvg.toFixed(1) + '分（<3分）遇瓶颈', action: '重点突破高级能力障碍' };
      return { level: '无瓶颈', text: '三层能力均分均达标（基本' + basicAvg.toFixed(1) + '/进阶' + advAvg.toFixed(1) + '/高级' + senAvg.toFixed(1) + '）', action: '可考虑岗位晋阶，预备下一岗位层级' };
    }

      '现场历练机会不足': '配置更多类型/规模的岗位实践机会',

    function renderRadarSVG(basicAvg, advAvg, senAvg) {
      var cx = 150, cy = 135, maxR = 85;
      var axes = [
        { name: '基本能力', value: basicAvg, angle: -Math.PI/2 },
        { name: '进阶能力', value: advAvg, angle: Math.PI/6 },
        { name: '高级能力', value: senAvg, angle: 5*Math.PI/6 }
      ];
      var accent = '#0d9488', ink = '#1e293b', rule = '#e2e8f0';
      function pt(axis, level) {
        var r = (maxR * (level || axis.value)) / 5;
        return [cx + r * Math.cos(axis.angle), cy + r * Math.sin(axis.angle)];
      }
      var svg = '<svg viewBox="0 0 300 270" style="width:100%;max-width:280px;margin:0 auto;display:block;">';
      for (var level = 5; level >= 1; level--) {
        var pts = axes.map(function(a) { var p = pt(a, level); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
        svg += '<polygon points="' + pts + '" fill="none" stroke="' + rule + '" stroke-width="1"/>';
      }
      axes.forEach(function(a) { var p = pt(a, 5); svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="' + rule + '" stroke-width="1"/>'; });
      var dataPts = axes.map(function(a) { var p = pt(a); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
      svg += '<polygon points="' + dataPts + '" fill="rgba(13,148,136,0.15)" stroke="' + accent + '" stroke-width="2"/>';
      axes.forEach(function(a) { var p = pt(a); svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" fill="' + accent + '"/>'; });
      axes.forEach(function(a, i) {
        var p = pt(a, 6.5);
        svg += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 4).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + ink + '">' + a.name + '</text>';
        svg += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 12).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="700" fill="' + accent + '">' + a.value.toFixed(1) + '</text>';
      });
      for (var lv = 1; lv <= 5; lv++) {
        var lp = pt(axes[0], lv);
        svg += '<text x="' + (lp[0] - 8).toFixed(1) + '" y="' + (lp[1] + 4).toFixed(1) + '" text-anchor="end" font-size="9" fill="#94a3b8">' + lv + '</text>';
      }
      svg += '</svg>';
      return svg;
    }

    function renderBarChart(questionIds) {
      var accent = '#0d9488', accent2 = '#0369a1', purple = '#7c3aed';
      var tierColors = { basic: accent, advanced: accent2, senior: purple };
      var tierNames = { basic: '基本', advanced: '进阶', senior: '高级' };
      var html = '<div class="bar-chart">';
      questionIds.forEach(function(n) {
        var q = QUESTIONS[n];
        var s = state[n];
        var score = likertScore(s);
        var width = (score / 5) * 100;

    // 通用词云 SVG（螺旋布局）
    function buildWordCloudSVG(items) {
      var map = {};
      items.forEach(function(w) { map[w.text] = (map[w.text] || 0) + w.weight; });
      var list = Object.keys(map).map(function(t) { return { text: t, weight: map[t] }; });
      list.sort(function(a, b) { return b.weight - a.weight; });
      if (list.length === 0) return '<p style="font-size:12px;color:var(--muted);text-align:center;">暂无数据</p>';
      var maxW = list[0].weight, minW = list[list.length - 1].weight;
      var W = 320, H = 260, cx = W / 2, cy = H / 2;
      function fontSize(w, len) {
        var fs;
        if (maxW === minW) fs = 20;
        else fs = 12 + ((w - minW) / (maxW - minW)) * 20;
        var maxFs = Math.floor((W - 8) / len);
        return Math.max(10, Math.min(fs, maxFs, 32));
      }
      var colors = ['#0d9488', '#0369a1', '#7c3aed', '#f59e0b', '#ef4444', '#0f766e'];
      var placed = [];
      function overlaps(x, y, w, h) {
        for (var i = 0; i < placed.length; i++) {
          var p = placed[i];
          if (x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y) return true;
        }
        return false;
      }
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:340px;margin:0 auto;display:block;">';
      list.forEach(function(item, idx) {
        var fs = fontSize(item.weight, item.text.length);
        var tw = item.text.length * fs;
        var th = fs * 1.3;
        var pos = null;
        for (var r = 0; r < 220; r += 2) {
          var theta = r * 0.35;
          var x = cx + r * Math.cos(theta) - tw / 2;
          var y = cy + r * Math.sin(theta) - th / 2;
          if (x < 2 || y < 2 || x + tw > W - 2 || y + th > H - 2) continue;
          if (!overlaps(x, y, tw, th)) { pos = { x: x, y: y }; break; }
        }
        if (!pos) pos = { x: 6 + (idx % 4) * 78, y: 6 + (idx % 4) * 62 };
        placed.push({ x: pos.x, y: pos.y, w: tw, h: th });
        var color = colors[idx % colors.length];
        var bold = item.weight >= maxW * 0.6 ? 700 : 500;
        svg += '<text x="' + pos.x.toFixed(1) + '" y="' + (pos.y + fs).toFixed(1) + '" font-size="' + fs + '" font-weight="' + bold + '" fill="' + color + '" opacity="0.92">' + esc(item.text) + '</text>';
      });
      svg += '</svg>';
      return svg;
    }

    // 单份答卷 → 词云词条（权重=6-得分，低分项加权）
    function collectWords(rec) {

    }

    function avgOfFor(rec, qs) {
      var scores = qs.map(function(n) { return likertScore(rec[n]); }).filter(function(s) { return s > 0; });
      if (!scores.length) return 0;
      return Math.round((scores.reduce(function(a,b){return a+b;},0) / scores.length) * 10) / 10;
    }

    function adminImportFiles(files) {
      var remaining = files.length;
      if (!remaining) return;
      Array.prototype.forEach.call(files, function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            var data = JSON.parse(e.target.result);
            adminAddRecord(data);
          } catch(err) { alert('文件解析失败：' + file.name); }
          remaining--;
          if (remaining === 0) renderStep();
        };
        reader.readAsText(file);
      });
    }

    function adminAddRecord(data) {
      var rec = data.responses || data;
      if (!rec || typeof rec !== 'object' || !rec.Q1) { alert('无效答卷数据（缺少 responses 或 Q1）'); return; }
      adminRecords.push(rec);
    }

    function adminImportPaste() {
      var ta = document.getElementById('adminPasteArea');
      if (!ta || !ta.value.trim()) { alert('请先粘贴答卷 JSON 数据'); return; }
      var candidates = ta.value.match(/\{[\s\S]*?\}/g) || [];
      var found = 0;
      candidates.forEach(function(c) {
        try { adminAddRecord(JSON.parse(c)); found++; } catch(e) {}
      });
      if (found === 0) { alert('未能解析任何答卷数据，请检查 JSON 格式'); return; }
      ta.value = '';
      renderStep();
    }

    function adminClear() { adminRecords = []; renderStep(); }

    function adminDownloadPlan(i) {
      var rec = adminRecords[i];
      if (!rec) return;
      downloadText(buildPlanText(rec).join('\n'), 'improvement_plan_' + (i+1) + '_' + Date.now() + '.txt');
    }

    function adminExportAllPlans() {
      if (!adminRecords.length) { alert('暂无数据'); return; }
      var lines = [];
      lines.push('工程监理序列-能力提升计划汇总（' + adminRecords.length + '人）');
      lines.push('生成时间：' + new Date().toLocaleString('zh-CN'));
      adminRecords.forEach(function(rec, i) {
        lines.push('');
        lines.push('========================================');
        lines.push('【第' + (i+1) + '份】' + (rec.Q0a || '-') + '（' + (rec.Q1 || '-') + (rec.Q4 && rec.Q4 !== '不区分' ? '·' + rec.Q4 : '') + '）' + (rec.Q0b ? '｜项目：' + rec.Q0b : ''));
        lines = lines.concat(buildPlanText(rec));
      });
      downloadText(lines.join('\n'), 'all_improvement_plans_' + Date.now() + '.txt');
    }

    function buildPlanText(rec) {
      var rqs = getRoleQsFor(rec);
      var allQs = rqs.basic.concat(rqs.advanced).concat(rqs.senior);
      var bAvg = avgOfFor(rec, rqs.basic);
      var aAvg = avgOfFor(rec, rqs.advanced);
      var sAvg = avgOfFor(rec, rqs.senior);
      var bn = getBottleneck(bAvg, aAvg, sAvg);
      var lines = [];
      lines.push('姓名：' + (rec.Q0a || '-'));
      lines.push('项目名称：' + (rec.Q0b || '-'));
      lines.push('岗位层级：' + (rec.Q1 || '-'));
      lines.push('专业方向：' + (rec.Q4 || '-'));
      lines.push('监理工龄：' + (rec.Q2 || '-'));
      lines.push('执业资格：' + ((rec.Q3 || []).join('、') || '-'));
      lines.push('职称：' + (rec.Q3b || '-'));
      lines.push('');
      lines.push('能力项自评明细：');
      allQs.forEach(function(n) {
        var q = QUESTIONS[n];
        var s = rec[n];
        var score = s || 0;
        var target = q.tier === 'senior' ? 3 : 4;
        var gap = score > 0 ? (target - score <= 0 ? '达标' : '+' + (target - score)) : '-';
        lines.push('  ' + n + ' ' + q.title.replace(/^【.*?】/, '') + '：' + (score || '未评') + '分（目标≥' + target + '，' + gap + '）');
      });
      lines.push('');
      lines.push('三层均分：基本' + bAvg.toFixed(1) + ' / 进阶' + aAvg.toFixed(1) + ' / 高级' + sAvg.toFixed(1));
      lines.push('瓶颈判定：' + bn.level + '：' + bn.text + ' → ' + bn.action);
      lines.push('障碍诊断：' + ((rec.Q32 || []).join('、') || '未选择'));
      lines.push('提升方式：' + ((rec.Q33 || []).join('、') || '未选择'));
      lines.push('导师类型：' + ((rec.Q34_mentorType || []).join('、') || '未选择'));
      lines.push('课程方向：' + ((rec.Q34_courseDirection || []).join('、') || '未选择'));
      lines.push('提升周期：' + (rec.Q35_cycle || '-') + '（' + (rec.Q35_currentLevel || '-') + ' → ' + (rec.Q35_targetLevel || '-') + '）');
      if (rec.Q35_target) lines.push('预计目标任务：' + rec.Q35_target);
      if (rec.Q35_priority) lines.push('优先提升项：' + rec.Q35_priority);
      if (rec.Q36) lines.push('计划要点反推：' + rec.Q36);
      return lines;
    }

    function downloadText(text, filename) {
      var blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    window.openAdmin = function() { adminMode = true; renderStep(); };
    window.exitAdmin = function() { adminMode = false; renderStep(); };
    window.adminImportFiles = adminImportFiles;
    window.adminImportPaste = adminImportPaste;
    window.adminClear = adminClear;
    window.adminDownloadPlan = adminDownloadPlan;
    window.adminExportAllPlans = adminExportAllPlans;
    window.renderStep = renderStep;

    // ===== 交互函数 =====
    window.selectRadio = function(qId, value) { state[qId] = value; window._preserveScroll = true; renderStep(); };
    window.selectLikert = function(qId, score) {
      var q = QUESTIONS[qId];
      if (q && q.tier === 'senior') {
        var roleQs = getRoleQs();
        var basicAvg = avgOf(roleQs.basic);
        var advAvg = avgOf(roleQs.advanced);
        var issues = [];
        if (basicAvg > 0 && score > basicAvg) issues.push('基本能力均分（' + basicAvg.toFixed(1) + '分）');
        if (advAvg > 0 && score > advAvg) issues.push('进阶能力均分（' + advAvg.toFixed(1) + '分）');
        if (issues.length) {
          showInvertModal('高级能力自评（' + score + '分）高于' + issues.join('、') + '，请重新选择符合实际的自评分数。');
          return;
        }
      }
      state[qId] = score; window._preserveScroll = true; renderStep();
    };
    window.showInvertModal = function(message) {
      var overlay = document.getElementById('invert-modal');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'invert-modal';
        overlay.className = 'modal-overlay';
        overlay.innerHTML = '<div class="modal-box"><div class="modal-title">自评层级提示</div><div class="modal-text"></div><button class="btn btn-primary" onclick="closeInvertModal()">重新选择</button></div>';
        document.body.appendChild(overlay);
      }
      overlay.querySelector('.modal-text').textContent = message;
      overlay.style.display = 'flex';
    };
    window.closeInvertModal = function() {
      var overlay = document.getElementById('invert-modal');
      if (overlay) overlay.style.display = 'none';
    };
    window.toggleMulti = function(qId, value, maxSelect) {
      var arr = state[qId] || [];
      if (typeof arr === 'string') arr = arr.split(',');
      var idx = arr.indexOf(value);
      if (idx >= 0) arr.splice(idx, 1);
      else { if (arr.length >= maxSelect) return; arr.push(value); }
      state[qId] = arr; window._preserveScroll = true; renderStep();
    };
    window.setStateValue = function(key, value) { state[key] = value; };
    window.nextStep = function() {
      var steps = getVisibleSteps();
      var step = steps[currentStepIdx];
      if (step.questions) {
        var error = validateStep(step);
        if (error) {
          var existing = document.querySelector('.validation-error');
          if (existing) existing.remove();
          var content = document.querySelector('.app-content');
          var errDiv = document.createElement('div');
          errDiv.className = 'validation-error';
          errDiv.textContent = error;
          content.insertBefore(errDiv, content.firstChild);
          return;
        }
      }
      var existingErr = document.querySelector('.validation-error');
      if (existingErr) existingErr.remove();
      if (currentStepIdx < steps.length - 1) {
        currentStepIdx++;
        var nextStepData = steps[currentStepIdx];
        if (nextStepData.id === 'results') { clearSavedState(); submitToBackend(); }
        else renderStep();
      }
    };
    window.prevStep = function() { if (currentStepIdx > 0) { currentStepIdx--; renderStep(); } };
    window.resetSurvey = function() { state = {}; currentStepIdx = 0; clearSavedState(); renderStep(); };
    window.restoreProgress = function() { loadSavedState(); renderStep(); };
    window.exportJSON = exportJSON;
    window.exportCSV = exportCSV;
    window.exportWordCloud = exportWordCloud;
    window.exportPlan = exportPlan;
    window.shareSurvey = shareSurvey;

    function validateStep(step) {
      if (!step.questions) return null;
      for (var i = 0; i < step.questions.length; i++) {
        var qId = step.questions[i];
        var q = QUESTIONS[qId];
        if (!q) continue;
        if (q.type === 'radio') {
          if (q.required && !state[qId]) return '请完成' + qId + '：' + q.title.replace(/^【.*?】/, '');
        } else if (q.type === 'text') {
          if (q.required && !(state[qId] || '').trim()) return '请完成' + qId + '：' + q.title.replace(/^【.*?】/, '');
        } else if (q.type === 'likert') {
          if (q.required !== false) {
            var s = state[qId];
            if (!s || (typeof s === 'object' && (!s.score || s.score === 0))) return '请完成' + qId + '的自评打分';
          }
        } else if (q.type === 'multiselect') {
          if (q.required !== false) {
            var arr = state[qId];
            if (!arr || (typeof arr === 'string' ? arr.split(',') : arr).length === 0) return '请至少选择一项：' + qId;
          }
        }
      }
      return null;
    }

    renderStep();
  })();
  </script>
</body>
